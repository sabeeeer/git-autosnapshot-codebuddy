name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $failed = $true; $errors | Format-List }
          }
          if ($failed) { exit 1 }
      - name: Snapshot regression
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_snapshot.ps1
